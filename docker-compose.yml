# docker-compose.yml
# Spins up: app + PostgreSQL + Redis with one command: docker compose up --build
version: '3.9'

services:
  app:
    build: .
    ports:
      - '5000:5000'
    env_file: .env
    environment:
      NODE_ENV:     production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/scalable_api?schema=public
      REDIS_URL:    redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       scalable_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:     ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test:     ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout:  5s
      retries:  5

volumes:
  postgres_data:
  redis_data:
